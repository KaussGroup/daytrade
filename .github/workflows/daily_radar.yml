name: Radar Day Trade B3 - Automacao Diaria

on:
  schedule:
    # 08:20 BRT (Pré-Mercado, Coleta & Processamento Matinal) = 11:20 UTC (Segunda a Sexta)
    - cron: '20 11 * * 1-5'
    # 10:15 BRT (Abertura de Wall Street & Ações B3) = 13:15 UTC (Segunda a Sexta)
    - cron: '15 13 * * 1-5'
    # 13:00 BRT (Ajuste Intradiário da Tarde) = 16:00 UTC (Segunda a Sexta)
    - cron: '00 16 * * 1-5'
    # 18:15 BRT (Fechamento e Auditoria) = 21:15 UTC (Segunda a Sexta)
    - cron: '15 21 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Selecione o modo de execucao'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - closing
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'run_briefing.py'
      - '.github/workflows/**'

jobs:
  run-radar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-bot.txt

      - name: Executar Rotina de Mercado (Abertura e Intradiário)
        if: ${{ github.event.schedule != '15 21 * * 1-5' && (github.event.inputs.mode != 'closing' || github.event_name == 'push') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          python run_briefing.py

      - name: Executar Rotina Vespertina (Fechamento & Auditoria)
        if: ${{ github.event.schedule == '15 21 * * 1-5' || github.event.inputs.mode == 'closing' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          python run_closing.py

      - name: Salvar e Commitar Dados Atualizados
        run: |
          git config --global user.name "Radar B3 Bot"
          git config --global user.email "bot@radardaytrade.com"
          git add index.html data/history.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore: atualizacao automatica do radar [skip ci]"
            git pull --rebase origin main || true
            git push || echo "⚠️ Ative 'Read and write permissions' em Settings > Actions > General para permitir que o bot salve dados no repositório."
          fi
